// ── STATE ─────────────────────────────────────────────────────────────────
let PAGE = 'today';
let CURDATE = new Date();
if(CURDATE < START) CURDATE = new Date(START);

// ── KEY HELPERS ───────────────────────────────────────────────────────────
function dateKey(d){ return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
function exKey(d,k){ return 'ex_'+dateKey(d)+'_'+k; }
function weekKey(){ var d=new Date(),s=new Date(d);s.setDate(d.getDate()-d.getDay());return 'wk_'+s.getFullYear()+'_'+s.getMonth()+'_'+s.getDate(); }
function protLogKey(d){ return 'pl_'+dateKey(d); }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }

// ── CHECKED ───────────────────────────────────────────────────────────────
function isChecked(d,k){ return sGet(exKey(d,k))==='1'; }
function setChecked(d,k,v){ sSet(exKey(d,k),v?'1':'0'); }
function toggleChecked(d,k){ setChecked(d,k,!isChecked(d,k)); }

// ── PROT LOG ──────────────────────────────────────────────────────────────
function getProtLog(d){ try{return JSON.parse(sGet(protLogKey(d))||'[]');}catch(e){return [];} }
function saveProtLog(d,log){ sSet(protLogKey(d),JSON.stringify(log)); }
function addProtItem(d,g,name){ var l=getProtLog(d);l.push({g:g,name:name});saveProtLog(d,l); }
function removeProtItem(d,idx){ var l=getProtLog(d);l.splice(idx,1);saveProtLog(d,l); }
function resetProtLog(d){ saveProtLog(d,[]); }

// ── DRINK ─────────────────────────────────────────────────────────────────
function getDrinks(){ return parseInt(sGet(weekKey())||'0'); }
function addDrink(){ sSet(weekKey(),getDrinks()+1); }
function removeDrink(){ var c=getDrinks();if(c>0)sSet(weekKey(),c-1); }

// ── PLAN HELPERS ──────────────────────────────────────────────────────────
function planForDate(d){ return PLAN[d.getDay()]; }
function isDayDone(d){ var p=planForDate(d);if(!p.exs.length)return true;return p.exs.every(function(k){return isChecked(d,k);}); }
function weeklyStats(){ var done=0,total=0,today=new Date();for(var i=0;i<7;i++){var dd=new Date(today);dd.setDate(dd.getDate()-today.getDay()+i);var p=PLAN[i];total+=p.exs.length;p.exs.forEach(function(k){if(isChecked(dd,k))done++;});}return done+'/'+total; }
function weekNum(){ return Math.max(1,Math.floor((new Date()-START)/(7*24*60*60*1000))+1); }
function exportData(){
  var data = {};
  // Export all MEM keys + localStorage
  var allKeys = Object.keys(MEM);
  // also scan localStorage
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k) allKeys.push(k);
    }
  }catch(e){}
  // dedupe
  allKeys = allKeys.filter(function(k,i){return allKeys.indexOf(k)===i;});
  allKeys.forEach(function(k){
    var v=sGet(k);
    if(v!==null) data[k]=v;
  });
  var json = JSON.stringify(data);
  var b64 = btoa(unescape(encodeURIComponent(json)));
  // Copy to clipboard
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(b64).then(function(){
      var el=document.getElementById('backup-msg');
      if(el){el.style.color='#FFD166';el.textContent='✓ 클립보드에 복사됨! Claude한테 업데이트 받은 후 가져오기에 붙여넣기';}
    }).catch(function(){showExportFallback(b64);});
  } else {
    showExportFallback(b64);
  }
}

function showExportFallback(b64){
  var el=document.getElementById('backup-msg');
  if(el){
    el.style.color='#FFD166';
    el.innerHTML='아래 코드를 복사하세요:<br><textarea style="width:100%;margin-top:6px;background:#0D1021;color:#FFD166;border:1px solid #FFD16640;border-radius:8px;padding:8px;font-size:10px;height:60px" readonly>'+b64+'</textarea>';
  }
}

function importData(){
  var code = prompt('내보내기에서 복사한 코드를 붙여넣으세요:');
  if(!code||!code.trim()) return;
  try{
    var json = decodeURIComponent(escape(atob(code.trim())));
    var data = JSON.parse(json);
    Object.keys(data).forEach(function(k){ sSet(k,data[k]); });
    var el=document.getElementById('backup-msg');
    if(el){el.style.color='#2DC653';el.textContent='✓ 데이터 복원 완료! ('+Object.keys(data).length+'개 항목)';}
    setTimeout(function(){render();},800);
  }catch(e){
    var el=document.getElementById('backup-msg');
    if(el){el.style.color='#E63946';el.textContent='코드가 잘못되었어요. 다시 확인해주세요.';}
  }
}

function getStreak(){ var s=0,today=new Date();for(var i=0;i<30;i++){var d=new Date(today);d.setDate(d.getDate()-i);if(d<START)break;if(isDayDone(d))s++;else if(i>0)break;}return s; }

// ── RENDER ─────────────────────────────────────────────────────────────────
function render(){
  var el = document.getElementById('content');
  var html = '';
  if(PAGE==='today') html = renderToday();
  else if(PAGE==='calendar') html = renderCalendar();
  else html = renderResults();
  el.innerHTML = html;
}

function H(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function closeModal(){ var m=document.getElementById('modal');if(m)m.remove();MODAL_KEY=null; }

// ── EVENT DELEGATION ──────────────────────────────────────────────────────
document.addEventListener('click', function(e){
  var el = e.target;
  // Walk up to find data-action
  while(el && el !== document.body){
    var action = el.getAttribute('data-action');
    if(action) break;
    el = el.parentElement;
  }
  if(!el||!el.getAttribute) return;
  var action = el.getAttribute('data-action');
  if(!action) return;

  if(action==='nav'){
    PAGE = el.getAttribute('data-page');
    document.querySelectorAll('.nb').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-page')===PAGE); });
    render();
  }
  else if(action==='goday'){
    var dow=parseInt(el.getAttribute('data-dow'));
    var today=new Date(), todayDow=today.getDay();
    var dd=new Date(today); dd.setDate(dd.getDate()-(todayDow-dow));
    CURDATE=dd; render();
  }
  else if(action==='prevday'){
    var nd=new Date(CURDATE); nd.setDate(nd.getDate()-1);
    if(nd>=START){ CURDATE=nd; render(); }
  }
  else if(action==='nextday'){
    var nd=new Date(CURDATE); nd.setDate(nd.getDate()+1);
    CURDATE=nd; render();
  }
  else if(action==='openex'){
    openModal(el.getAttribute('data-key'));
  }
  else if(action==='addfood'){
    var idx=parseInt(el.getAttribute('data-idx'));
    var f=PROT_FOODS[idx]; if(!f)return;
    addProtItem(CURDATE, f.g, f.icon+' '+f.label);
    render();
  }
  else if(action==='addcustom'){
    var nm=document.getElementById('pname');
    var gm=document.getElementById('pgram');
    if(!gm)return;
    var g=parseInt(gm.value);
    if(!g||g<=0)return;
    var name=(nm&&nm.value.trim())||'직접입력';
    addProtItem(CURDATE,g,name);
    if(nm)nm.value=''; gm.value='';
    render();
  }
  else if(action==='removeprot'){
    removeProtItem(CURDATE,parseInt(el.getAttribute('data-idx')));
    render();
  }
  else if(action==='resetprot'){
    resetProtLog(CURDATE); render();
  }
  else if(action==='toggleshake'){
    toggleChecked(CURDATE,'shake'); render();
  }
  else if(action==='adddrink'){
    addDrink(); render();
  }
  else if(action==='removedrink'){
    removeDrink(); render();
  }
  else if(action==='toggletip'){
    var tb=document.getElementById('tipbody');
    var ta=document.getElementById('tiparrow');
    if(!tb)return;
    var open=tb.style.display!=='none';
    tb.style.display=open?'none':'block';
    if(ta)ta.textContent=open?'▼':'▲';
  }
  else if(action==='exportdata'){
    exportData();
  }
  else if(action==='importdata'){
    importData();
  }
  else if(action==='gotodate'){
    var y=parseInt(el.getAttribute('data-y')),m=parseInt(el.getAttribute('data-m')),d=parseInt(el.getAttribute('data-d'));
    if(d<3)return;
    CURDATE=new Date(y,m,d); PAGE='today';
    document.querySelectorAll('.nb').forEach(function(b){ b.classList.toggle('on',b.getAttribute('data-page')==='today'); });
    render();
  }
});

// Init
render();
</script>
